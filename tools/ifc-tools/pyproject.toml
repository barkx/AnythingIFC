[project]
name = "ifc-tools"
version = "0.1.0"
description = "IFCWise job preparation and IFC validation CLI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ezdxf>=1.4.5",
    "httpx>=0.28.1",
    "ifcopenshell>=0.9.0.post1",
    "jinja2>=3.1.6",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "typer>=0.12",
]

[project.scripts]
ifc-tools = "ifc_tools.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifc_tools"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
